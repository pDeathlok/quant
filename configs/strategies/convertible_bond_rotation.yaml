# 可转债双低轮动策略。
#
# 数据源:
#   - Tushare cb_basic: 基础资料、剩余规模、评级、转股起止日
#   - Tushare cb_daily: 日行情、成交额、转股溢价率
#   - Tushare cb_call: 强赎/赎回风险过滤
release:
  lifecycle: production
  consumer: quant.routine.convertible_bond_plan
  dependency_nodes:
    - feature.cb_grid
    - product.cb_grid

strategy:
  id: cb_double_low_rotation
  name: 可转债双低轮动
  enabled: true
  top_n: 10
  max_position_weight: 0.12
  min_score: 0.0
  rebalance_threshold: 0.01
  filter:
    min_price: 100.0
    max_price: 135.0
    max_premium_rate: 35.0
    min_amount: 1000.0
    min_remaining_size: 1.0
    min_credit_rating: AA-
    exclude_call_risk: true
    exclude_not_convertible: true
