# B1 selected production strategies.
#
# Strategy record:
#   docs/strategies/b1_selected_strategy_record.md
#
# Summary:
#   - B1 is a mean-reversion candidate signal with the old hard volume-increase
#     condition removed.
#   - Entry uses fixed thresholds instead of daily top-rank selection, so the
#     routine can stay empty when no signal is good enough.
#   - pred_up8_es controls upside elasticity.
#   - pred_down3_es controls the risk of falling through the stop before rebound.
#   - b1_stable is the current primary strategy.
#   - b1_aggressive is retained as a stricter high-quality opportunity strategy.
strategies:
