[project]
name = "quant"
version = "0.1.0"
description = "Tushare-first quantitative strategy research and stock selector"
authors = [{name = "Quant Developer"}]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "talib-binary>=0.4.19",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "plotly>=5.18.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
    "tushare>=1.4.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]
